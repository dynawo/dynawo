<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NRT viewer</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">NRT viewer</a>
    <div class="run-info" id="run-info"></div>
  </header>
  <main id="app"><p class="placeholder">Loading results…</p></main>

  <dialog id="accept-dialog">
    <form method="dialog" class="dialog-body">
      <h2>Update reference</h2>
      <p class="dialog-case" id="accept-case"></p>
      <p>The selected output files will overwrite the reference files of this test case in the source tree.</p>
      <div class="accept-kinds" id="accept-kinds"></div>
      <div class="accept-files" id="accept-files"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn">Cancel</button>
        <button value="confirm" class="btn btn-danger" id="accept-confirm">Overwrite reference</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
