name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Resolve Linux image
        id: resolve
        run: |
          docker pull --platform linux/amd64 dynawo/dynawo-ci-ol8:latest
          image=$(docker image inspect dynawo/dynawo-ci-ol8:latest --format '{{index .RepoDigests 0}}')
          [[ "$image" =~ ^dynawo/dynawo-ci-ol8@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  coordinate:
    name: Find matching push builds
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.lookup.outputs.windows }}
    steps:
      - id: lookup
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            core.setOutput('windows', 'false');
            if (process.env.HEAD_REPO !== `${context.repo.owner}/${context.repo.repo}`) return;
            const repo = context.repo;
            try {
              // Only trust the version of the push workflow reviewed on the base branch.
              const file = async ref => (await github.rest.repos.getContent({
                ...repo, path: '.github/workflows/ci.yml', ref
              })).data;
              const [base, head] = await Promise.all([file(process.env.BASE_SHA), file(process.env.HEAD_SHA)]);
              if (!base.sha || base.sha !== head.sha) {
                core.notice('Push workflow differs from base; running the PR build.');
                return;
              }
              const deadline = Date.now() + 15 * 60 * 1000;
              while (Date.now() < deadline) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...repo, workflow_id: 'ci.yml', event: 'push', branch: process.env.HEAD_BRANCH, per_page: 100
                });
                const matches = runs.filter(r => r.head_sha === process.env.HEAD_SHA &&
                  r.head_repository?.full_name === process.env.HEAD_REPO)
                  .sort ( (a, b) => b.id - a.id );
                if (!matches.length) {
                  await new Promise(resolve => setTimeout(resolve, 15000));
                  continue;
                }
                const run = matches[0];
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
                });
                const build = jobs.find(j => j.name === 'build windows');
                if (build?.status === 'completed') {
                  if (build.conclusion === 'success') core.setOutput('windows', 'true');
                  else if (build.conclusion === 'failure' || build.conclusion === 'timed_out')
                    core.setFailed(`Matching push Windows build ${build.conclusion}.`);
                  else core.notice(`Push build ${build.conclusion}; running the PR build.`);
                  return;
                }
                if (run.status === 'completed') return;
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
              core.notice('Push lookup timed out; running the PR build.');
            } catch (error) {
              core.warning(`Push lookup failed; running the PR build: ${error.message}`);
            }

  linux:
    name: Linux Release build and full NRT
    needs: linux-image
    runs-on: ubuntu-latest
    container: ${{ needs.linux-image.outputs.image }}
    env:
      DYNAWO_BUILD_TYPE: Release
      DYNAWO_COMPILER: GCC
      DYNAWO_RESULTS_SHOW: "false"
      DYNAWO_PYTHON_COMMAND: python3
      DYNAWO_INSTALL_OPENMODELICA: /opt/OpenModelica/Install
      DYNAWO_SRC_OPENMODELICA: /opt/OpenModelica/Source
      DYNAWO_NB_PROCESSORS_USED: 2
      DYNAWO_BUILD_DIR: ${{ github.workspace }}/build/ci/shared/dynawo
      DYNAWO_INSTALL_DIR: ${{ github.workspace }}/install/ci/shared/dynawo
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Find Linux build artifact
        id: linux-lookup
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            if (process.env.HEAD_REPO !== `${context.repo.owner}/${context.repo.repo}`) return;
            const repo = context.repo;
            try {
              const file = async ref => (await github.rest.repos.getContent({
                ...repo, path: '.github/workflows/ci.yml', ref
              })).data;
              const [base, head] = await Promise.all([file(process.env.BASE_SHA), file(process.env.HEAD_SHA)]);
              if (!base.sha || base.sha !== head.sha) return;
              const deadline = Date.now() + 90 * 60 * 1000;
              while (Date.now() < deadline) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...repo, workflow_id: 'ci.yml', event: 'push', branch: process.env.HEAD_BRANCH, per_page: 100
                });
                const run = runs.filter(r => r.head_sha === process.env.HEAD_SHA &&
                  r.head_repository?.full_name === process.env.HEAD_REPO).sort((a, b) => b.id - a.id)[0];
                if (run) {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                    ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
                  });
                  const build = jobs.find(j => j.name === 'build linux');
                  if (build?.status === 'completed' && build.conclusion !== 'success') return;
                  const name = `linux-build-${run.run_attempt}`;
                  const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                    ...repo, run_id: run.id, per_page: 100
                  });
                  if (build && artifacts.some(a => a.name === name && !a.expired)) {
                    core.setOutput('run-id', String(run.id));
                    core.setOutput('name', name);
                    return;
                  }
                  if (run.status === 'completed') return;
                }
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
              core.notice('Linux artifact lookup timed out; rebuilding.');
            } catch (error) {
              core.warning(`Linux artifact lookup failed; rebuilding: ${error.message}`);
            }
      - name: Download Linux build
        id: linux-download
        if: steps.linux-lookup.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.linux-lookup.outputs.name }}
          run-id: ${{ steps.linux-lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          path: linux-artifact
      - name: Restore Linux build and build NRT models
        id: linux-restore
        if: steps.linux-download.outcome == 'success'
        continue-on-error: true
        env:
          LINUX_IMAGE: ${{ needs.linux-image.outputs.image }}
        run: |
          test ! -e build && test ! -e install
          test "$(tar -xOf linux-artifact/linux-build.tar linux-build-workspace.txt)" = "$(pwd)"
          test "$(tar -xOf linux-artifact/linux-build.tar linux-build-image.txt)" = "$LINUX_IMAGE"
          touch linux-restore-started
          tar -xf linux-artifact/linux-build.tar
          export DYNAWO_HOME=$(pwd)
          util/envDynawo.sh version
          util/envDynawo.sh build-nrt-models
      - name: Build
        if: steps.linux-restore.outcome != 'success'
        run: |
          if [ -f linux-restore-started ]; then
            rm -rf build install
          fi
          export DYNAWO_HOME=$(pwd)
          util/envDynawo.sh build-user
          util/envDynawo.sh build-nrt-models
      - name: Full Linux NRT
        run: |
          export DYNAWO_HOME=$(pwd)
          export DYNAWO_NB_PROCESSORS_USED=1
          sed -i 's/dtw_exceptions = {}/dtw_exceptions = {"GFM_Fault" : 1, "PmConstAc6aPss3b":1}/' util/nrt_diff/settings.py
          time util/envDynawo.sh nrt
      - name: Upload NRT reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-nrt-reports
          path: |
            nrt/output/**/report.html
            nrt/output/**/nrt_nok.txt
          if-no-files-found: warn
      - name: Verify PR head
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const {data} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            if (data.head.sha !== process.env.EXPECTED_SHA) core.setFailed('PR head changed during the build.');

  windows-smoke:
    name: Windows runtime smoke
    runs-on: windows-2022
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare sources
        shell: cmd
        run: |
          cd ..
          move dynawo \ || exit /b 1
          md dynawo || exit /b 1
          choco install wget --no-progress || exit /b 1
          cd \
          wget -nv https://github.com/dynawo/dynawo/releases/download/nightly/OpenModelica-windows.zip || exit /b 1
          7z x OpenModelica-windows.zip || exit /b 1
      - name: Build and run smoke tests
        shell: cmd
        env:
          PATH: C:\Windows\system32;C:\Program Files\Git\cmd;C:\hostedtoolcache\windows\Python\3.12.10\x64
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cd \dynawo
          cmake -Wno-dev -S dynawo/3rdParty -B b-3-p -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../../d-3-p -DOPENMODELICA_INSTALL=../../OpenModelica -DOPENMODELICA_SRC=../../OpenModelica/Source -DOMDEV_HOME=../../OMDev -G "Ninja" || exit /b 1
          cmake --build b-3-p || exit /b 1
          cmake -Wno-dev -S dynawo -B b -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../d-i -DDYNAWO_HOME=.. -DINSTALL_OPENMODELICA=../../OpenModelica -DDYNAWO_THIRD_PARTY_DIR=../../d-3-p -G "Ninja" || exit /b 1
          cmake --build b --target install || exit /b 1
          cmake --build b --target models-cpp || exit /b 1
          cmake --build b --target SMIB_MODELS || exit /b 1
          cmake --build b --target LoadAlphaBeta || exit /b 1
          cmake --build b --target GeneratorSynchronousFourWindingsProportionalRegulations || exit /b 1
          cmake --build b --target GeneratorSynchronousThreeWindingsProportionalRegulations || exit /b 1
          cmake --build b --target solvers || exit /b 1
          call \d-i\dynawo.cmd jobs nrt\data\SMIB\SMIB_BasicTestCases\SMIB_1_StepPm\SMIB.jobs || exit /b 1
          call \d-i\dynawo.cmd jobs nrt\data\IEEE14\IEEE14_SyntaxExamples\IEEE14_BlackBoxModels\IEEE14.jobs || exit /b 1

  unit-tests:
    name: Linux unit tests
    runs-on: ubuntu-latest
    container: dynawo/dynawo-ci-ol8:latest
    env:
      DYNAWO_BUILD_TYPE: Debug
      DYNAWO_COMPILER: GCC
      DYNAWO_RESULTS_SHOW: "false"
      DYNAWO_PYTHON_COMMAND: python3
      DYNAWO_INSTALL_OPENMODELICA: /opt/OpenModelica/Install
      DYNAWO_SRC_OPENMODELICA: /opt/OpenModelica/Source
      DYNAWO_NB_PROCESSORS_USED: 2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and run tests
        run: |
          export DYNAWO_HOME=$(pwd)
          util/envDynawo.sh build-tests

  windows:
    name: Windows Release build
    needs: [coordinate, windows-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build
        if: needs.coordinate.result != 'success' || needs.windows-smoke.result != 'success'
        shell: bash
        run: exit 1
      - name: Verify PR head
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const {data} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            if (data.head.sha !== process.env.EXPECTED_SHA) core.setFailed('PR head changed during the build.');
